.btn-comenzar {
  background-color: #28a745; /* Verde */
  color: #ffffff;            /* Texto blanco */
  border: none;              /* Elimina el borde por defecto */
  border-radius: 20px;       /* Bordes redondeados */
  padding: 12px 24px;        /* Espaciado interno */
  font-size: 16px;           /* Tamaño del texto */
  font-weight: bold;         /* Texto en negrita */
  cursor: pointer;           /* Cambia el cursor al pasar por encima */
  transition: background-color 0.3s ease;
}

/* Efecto al pasar el cursor (hover) */
.btn-comenzar:hover {
  background-color: #218838; /* Verde un poco más oscuro */
}
 td, th {
    width: 100px;
  
  /* Opcional pero recomendado: fija la altura si tampoco quieres que crezca verticalmente */
  height: 50px;
  /* 1. Color y Tipografía */
  color: #0f172a;               /* Azul/Gris muy oscuro (mejor legibilidad que el negro puro) */
  font-family: system-ui, -apple-system, sans-serif; /* Fuente moderna y nítida */
  font-size: 30px;          /* Tamaño equivalente a 18px */

  /* 2. Alineación y Espaciado */
  text-align: center;           /* Centra el contenido (ideal para números o datos cortos) */
  padding: 1px 1px;           /* Espacio interno para que el texto no toque los bordes */
  vertical-align: middle;       /* Centrado vertical */

  /* 3. Bordes e Interacción */
  transition: all 0.2s ease;    /* Transición suave para el efecto al pasar el ratón */
  /* Define el ancho exacto que tendrá la celda */
  
}
table {
            color: #2b6cb0; /* Cambia este valor al color que prefieras */
            table-layout: fixed;
   /* O un ancho fijo global, por ejemplo: width: 600px; */
        }
        /* Estilos de la barra superior */
        .tiempo-barra-contenedor {
            width: 100%;
            height: 20px;
            background-color: #e0e0e0;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .tiempo-barra-relleno {
            height: 100%;
            width: 100%; /* Inicia llena */
            background-color: #4CAF50; /* Color verde inicial */
            transition: width 0.1s linear, background-color 0.5s ease;
        }
        /* CSS RESET & VARIABLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #4A90E2;
            --primary-dark: #357ABD;
            --bg-color: #F4F7F6;
            --sidebar-bg: #1E293B;
            --sidebar-text: #94A3B8;
            --text-color: #FFFFFF;
            --card-bg: #FFFFFF;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* BARRA LATERAL (SIDEBAR) */
        aside {
            width: 200px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(100,0,0,0.1);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            color: #FFFFFF;
        }

        .brand svg {
            width: 40px;
            height: 40px;
            fill: var(--primary-color);
        }

        .brand h1 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .menu-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #FFFFFF;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        nav ul {
            list-style: none;
        }

        nav li {
            margin-bottom: 10px;
        }

        nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        nav a:hover, nav a.active {
            background-color: var(--primary-color);
            color: #FFFFFF;
        }

        /* CONTENIDO PRINCIPAL */
        main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        header {
            margin-bottom: 30px;
        }

        header h2 {
            font-size: 2rem;
            color: #1E293B;
            margin-bottom: 8px;
        }

        header p {
            color: #64748B;
        }

        /* PARRILLA DE JUEGOS */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            border: 1px solid #E2E8F0;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .game-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background-color: #EBF5FF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 16px;
        }

        .game-card h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .game-card p {
            font-size: 0.9rem;
            color: #64748B;
            line-height: 1.4;
        }

            }

                height: auto;
                padding: 15px;

            }

            nav ul {

                gap: 10px;
                overflow-x: auto;
            }

                margin-bottom: 0;
            }

            main {
                padding: 20px;
            }

        function validanumero(numero){
            alert(numero);
        }

        const btnEntrar = document.getElementById('btnEntrar');
        const btnSalir = document.getElementById('btnSalir');
        const estadoText = document.getElementById('estado');

        // 1. Función para activar el modo pantalla completa
        function entrarPantallaCompleta() {
            const elem = document.documentElement; // Aplica a toda la página

            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari / iOS */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
            var boton = document.getElementById('btn-pantcomp');
      
            // Para habilitarlo, cambiamos la propiedad 'disabled' a false
            boton.disabled = true;
            boton.style.backgroundColor = '#808080'; // O también: 'gray' o '#6c757d' 
            boton.style.cursor = 'not-allowed';       // Opcional: cambia el curso
            boton = document.getElementById('btn-comenzar');
            boton.disabled = false;
            boton.style.backgroundColor = '#28a745'; // O también: 'gray' o '#6c757d'
            boton.style.cursor = 'allowed';       // Opcional: cambia el curso
        }


        // 3. Listener para actualizar la interfaz al cambiar el estado
        // (captura el cambio tanto si se pulsa un botón como si se presiona la tecla ESC)
        function actualizarEstadoUI() {
        const enPantallaCompleta = !!(
            document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.msFullscreenElement
        );

        if (enPantallaCompleta) {
            estadoText.textContent = "Estado: Pantalla Completa";
            btnEntrar.disabled = true;
            btnSalir.disabled = false;
        } else {
            estadoText.textContent = "Estado: Pantalla Normal";
            btnEntrar.disabled = false;
            btnSalir.disabled = true;
        }
        }

        function rellenatabla(){
            
            const boton = document.getElementById('btn-comenzar');
            boton.style.backgroundColor = '#808080'; // O también: 'gray' o '#6c757d'
            boton.style.cursor = 'not-allowed';       // Opcional: cambia el curso
            // 1. Deshabilitar el botón
            boton.disabled = true;
            
            var cantidad = 5;
            var min = 0;
            var max = 99;

            const enterosAleatorios = [];

            const celdasNumeros = [];

            for (let i = 0; i < cantidad; i++) {
                // Genera un entero aleatorio entre min y max (ambos incluidos)
                var numero = Math.floor(Math.random() * (max - min + 1)) + min;
                
                while(celdasNumeros.indexOf(numero)>=0){
                    
                    numero = Math.floor(Math.random() * (max - min + 1)) + min;
                }
                celdasNumeros.push(numero);   
            }

            // 2. Llenamos el array con el bucle
            for (let i = 0; i < cantidad; i++) {
                // Genera un entero aleatorio entre min y max (ambos incluidos)
                var numero = Math.floor(Math.random() * (max - min + 1)) + min;
                
                while(enterosAleatorios.indexOf(numero)>=0){
                    
                    numero = Math.floor(Math.random() * (max - min + 1)) + min;
                }
                enterosAleatorios.push(numero);   


                document.getElementById("cell-" + celdasNumeros[i]).textContent=enterosAleatorios[i];
            }
            
            iniciarBarraTiempo(20000);
        }
       function  iniciarBarraTiempo(tiempo) {
            const tiempoTotalMs = tiempo; 
            const intervaloMs = 50;      // Frecuencia de actualización
            
            const barra = document.getElementById('barraRelleno');
            let tiempoRestante = tiempoTotalMs;

            // Asegurar que la barra empiece llena al llamar la función
            barra.style.width = '100%';
            barra.style.backgroundColor = ''; // Restablece el color original si cambió antes

            const temporizador = setInterval(() => {
                tiempoRestante -= intervaloMs;

                // Calcular el porcentaje restante
                let porcentaje = (tiempoRestante / tiempoTotalMs) * 100;

                if (porcentaje <= 0) {
                    porcentaje = 0;
                    clearInterval(temporizador);
                    console.log("¡Tiempo agotado!");
                    // Aquí puedes llamar a otra función cuando termine el tiempo
                }

                // Aplicar el nuevo ancho a la barra
                barra.style.width = porcentaje + '%';

                // Cambiar de color a rojo cuando quede poco (menos del 25%)
                if (porcentaje < 25) {
                    barra.style.backgroundColor = '#f44336';
                }

            }, intervaloMs);
    }
