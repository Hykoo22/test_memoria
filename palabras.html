<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anagramas - Mente En Forma</title>
  
    <style>
        /* CSS RESET & VARIABLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #3B82F6;
            --sidebar-bg: #1E293B;
            --main-bg: #0F172A;
            --cell-bg: #1E293B;
            --cell-hover: #334155;
            --sidebar-text: #94A3B8;
            --text-color: #F8FAFC;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--main-bg);
            color: var(--text-color);
            overflow: hidden;
        }

        /* BOTÓN COMENZAR */
        .btn-comenzar {
            background-color: #28a745;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-comenzar:hover {
            background-color: #218838;
        }

        /* BOTÓN SALIR PANTALLA COMPLETA */
        .btn-salir-fullscreen {
            background-color: #DC2626;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
            transition: background-color 0.3s ease, opacity 0.3s ease;
        }

        .btn-salir-fullscreen:hover:not(:disabled) {
            background-color: #B91C1C;
        }

        .btn-salir-fullscreen:disabled {
            background-color: #475569;
            color: #94A3B8;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* BARRA SUPERIOR DE TIEMPO */
        .tiempo-barra-contenedor {
            width: 100%;
            height: 15px;
            background-color: #334155;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .tiempo-barra-relleno {
            height: 100%;
            width: 100%;
            background-color: #4CAF50;
            transition: width 0.1s linear, background-color 0.5s ease;
        }

        /* BARRA LATERAL (SIDEBAR) */
        aside {
            width: 230px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            color: #FFFFFF;
        }

        .brand svg {
            width: 40px;
            height: 40px;
            fill: var(--primary-color);
        }

        .brand h1 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .menu-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--sidebar-text);
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        /* PANEL Y TARJETAS ESTADÍSTICAS DEL MENÚ */
        .panel-control {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stat-card {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .stat-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .stat-title {
            display: block;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--sidebar-text);
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: #FFFFFF;
            font-family: 'Courier New', Courier, monospace;
        }

        .stat-value.highlight {
            color: #4ADE80;
        }

        .stat-value.record {
            color: #FBBF24;
        }

        /* CONTENIDO PRINCIPAL */
        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: var(--main-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        header {
            margin-bottom: 15px;
            text-align: center;
        }

        header h2 {
            font-size: 1.8rem;
            color: #F8FAFC;
            margin-bottom: 4px;
        }

        header p {
            color: #94A3B8;
            font-size: 0.95rem;
        }

        /* ÁREA DE JUEGO AMBPLIADA */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1250px;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* PANEL SUPERIOR DE CONTROLES: INTENTOS Y COMODINES */
        .paneles-superiores {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-wrap: wrap;
        }

        .intentos-contenedor-exterior, .comodines-contenedor-exterior {
            height: 55px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: var(--sidebar-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .intentos-titulo, .comodines-titulo {
            font-size: 0.85rem;
            font-weight: 700;
            color: #CBD5E1;
            letter-spacing: 1.5px;
        }

        .corazon {
            font-size: 1.4rem;
            transition: all 0.3s ease;
        }

        .corazon.activo {
            color: #DC2626;
            opacity: 0.9;
        }

        .corazon.inactivo {
            color: #475569;
            opacity: 0.25;
            transform: scale(0.85);
        }

        /* ESTILOS CON RELIEVE Y EFECTO BOTÓN PARA LOS COMODINES */
        .btn-comodin {
            background: linear-gradient(145deg, #334155, #1e293b);
            border: 1px solid #475569;
            border-radius: 10px;
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #0f172a, 0 5px 8px rgba(0,0,0,0.4);
            transition: all 0.15s ease;
            user-select: none;
        }

        .btn-comodin:hover:not(:disabled) {
            transform: translateY(-2px);
            background: linear-gradient(145deg, #475569, #334155);
            border-color: #FBBF24;
            box-shadow: 0 6px 0 #0f172a, 0 8px 12px rgba(251, 191, 36, 0.2);
        }

        .btn-comodin:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0f172a, 0 3px 4px rgba(0,0,0,0.3);
        }

        .btn-comodin:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(100%);
            box-shadow: none;
            background: #1e293b;
            border-color: #334155;
            transform: none;
        }

        /* SECCIÓN SUPERIOR CON PALABRA Y RESPUESTA AL LADO */
        .seccion-palabras {
            display: flex;
            gap: 20px;
            width: 100%;
            align-items: center;
            justify-content: center;
        }

        .box-palabra-desordenada {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--sidebar-bg);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 15px;
            height: 90px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
            text-align: center;
            overflow: hidden;
        }

        .operacion-texto {
            font-size: clamp(1.4rem, 2.5vw, 2.4rem);
            font-weight: 800;
            color: #FBBF24;
            letter-spacing: 3px;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .box-pantalla-respuesta {
            flex: 1;
            height: 90px;
            background-color: #0F172A;
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            color: #4ADE80;
            font-size: clamp(1.3rem, 2.3vw, 2.2rem);
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 3px;
            white-space: nowrap;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        .box-pantalla-respuesta.pantalla-fallo {
            background-color: #7F1D1D !important;
            border-color: #EF4444 !important;
            color: #FCA5A5 !important;
        }

        .box-pantalla-respuesta.pantalla-acierto {
            background-color: #14532D !important;
            border-color: #22C55E !important;
            color: #86EFAC !important;
        }

        /* SECCIÓN INFERIOR: TECLADO ANCHO */
        .teclado-qwerty-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: 10px;
        }

        .fila-qwerty {
            display: flex;
            gap: 10px;
            width: 100%;
            height: 70px;
            justify-content: center;
        }

        .btn-key {
            background-color: var(--cell-bg);
            color: #FFFFFF;
            border: 1px solid #334155;
            border-radius: 10px;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            -webkit-user-select: none; /* Bloquea la selección accidental de texto en iOS */
            touch-action: manipulation; /* Evita que el doble toque haga zoom */
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
        }

        .btn-key:hover {
            background-color: var(--cell-hover);
            transform: translateY(-2px);
            border-color: var(--primary-color);
        }

        .btn-key:active {
            transform: translateY(1px);
        }

        .btn-borrar {
            background-color: #D97706;
            border-color: #B45309;
            flex: 1.5;
            font-size: 1.6rem;
        }

        .btn-borrar:hover {
            background-color: #B45309;
        }

        .btn-validar {
            background-color: #16A34A;
            border-color: #15803D;
            max-width: 500px;
            font-size: 1.4rem;
        }

        .btn-validar:hover {
            background-color: #15803D;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }

            aside {
                width: 100%;
                height: auto;
                padding: 12px 20px;
            }

            .brand {
                margin-bottom: 10px;
            }

            .menu-label {
                display: none;
            }

            .panel-control {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                gap: 10px;
            }

            .stat-card {
                padding: 6px 12px;
                min-width: 90px;
            }

            .stat-value {
                font-size: 1.2rem;
            }

            .btn-comenzar, .btn-salir-fullscreen {
                width: auto;
                margin-top: 0;
                padding: 8px 16px;
            }

            main {
                padding: 10px;
            }

            .seccion-palabras {
                flex-direction: column;
                gap: 10px;
            }

            .box-palabra-desordenada, .box-pantalla-respuesta {
                width: 100%;
                height: 65px;
            }

            .fila-qwerty {
                height: 50px;
                gap: 5px;
            }

            .btn-key {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="tiempo-barra-contenedor">
        <div id="barraRelleno" class="tiempo-barra-relleno"></div>
    </div>

    <!-- BARRA LATERAL / MENÚ -->
    <aside>
        <div class="brand">
            <svg viewBox="0 0 24 24">
                <path d="M12,3A9,9 0 0,0 3,12A9,9 0 0,0 12,21A9,9 0 0,0 21,12A9,9 0 0,0 12,3M12,5A7,7 0 0,1 19,12C19,13.86 18.27,15.55 17.08,16.81L15.66,15.39C16.5,14.47 17,13.29 17,12A5,5 0 0,0 12,7A5,5 0 0,0 7,12C7,13.29 7.5,14.47 8.34,15.39L6.92,16.81C5.73,15.55 5,13.86 5,12A7,7 0 0,1 12,5M12,9A3,3 0 0,0 9,12C9,12.83 9.34,13.58 9.89,14.12L11.31,12.7C11.11,12.5 11,12.26 11,12A1,1 0 0,1 12,11A1,1 0 0,1 13,12C13,12.26 12.89,12.5 12.69,12.7L14.11,14.12C14.66,13.58 15,12.83 15,12A3,3 0 0,0 12,9Z"/>
            </svg>
            <h1>Mente En Forma</h1>
        </div>

        <span class="menu-label">Anagramas</span>
        
        <div class="panel-control">
            <button id="btn-comenzar" class="btn-comenzar">Comenzar</button>
            
            <div class="stat-card">
                <span class="stat-title">NIVEL</span>
                <span id="label-level" class="stat-value highlight">1</span>
            </div>

            <div class="stat-card">
                <span class="stat-title">PUNTUACIÓN</span>
                <span id="label-score" class="stat-value">0</span>
            </div>

            <div class="stat-card">
                <span class="stat-title">MÁXIMA HISTÓRICA</span>
                <span id="label-record" class="stat-value record">0</span>
            </div>

            <button id="btn-salir-fullscreen" class="btn-salir-fullscreen" disabled>
                Salir Pantalla Completa
            </button>
        </div>
    </aside>

    <!-- ÁREA DE CONTENIDO -->
    <main>
        <header>
            <h2>Desafío de Anagramas</h2>
            <p>Ordena las letras para formar la palabra correcta antes de que acabe el tiempo</p>
        </header>

        <div class="game-container">
            <!-- PANELES SUPERIORES: INTENTOS Y COMODINES -->
            <div class="paneles-superiores">
                <div class="intentos-contenedor-exterior">
                    <span class="intentos-titulo">INTENTOS:</span>
                    <span id="corazon-1" class="corazon activo">❤️</span>
                    <span id="corazon-2" class="corazon activo">❤️</span>
                    <span id="corazon-3" class="corazon activo">❤️</span>
                </div>

                <div class="comodines-contenedor-exterior">
                    <span class="comodines-titulo">PISTAS:</span>
                    <button id="comodin-1" class="btn-comodin" title="Revelar letra">💡</button>
                    <button id="comodin-2" class="btn-comodin" title="Revelar letra">💡</button>
                    <button id="comodin-3" class="btn-comodin" title="Revelar letra">💡</button>
                </div>
            </div>

            <!-- FILA SUPERIOR: PALABRA DESORDENADA Y GUIONES/RESPUESTA -->
            <div class="seccion-palabras">
                <div class="box-palabra-desordenada">
                    <div id="label-operacion" class="operacion-texto">PALABRA</div>
                </div>
                <div id="pantalla-respuesta" class="box-pantalla-respuesta"></div>
            </div>

            <!-- FILA INFERIOR: TECLADO -->
            <div id="teclado" class="teclado-qwerty-container"></div>
        </div>
    </main>

    <!-- JS MÓDULO CON FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIMivopA82_zR5ZG96tX6jxghv9uL9tmE",
            authDomain: "puntuacionesminijuegos.firebaseapp.com",
            projectId: "puntuacionesminijuegos",
            storageBucket: "puntuacionesminijuegos.firebasestorage.app",
            messagingSenderId: "81023769064",
            appId: "1:81023769064:web:9194299f3d24581105ec5d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // BANCO LOCAL DE RESPALDO
        const DICCIONARIO_LOCAL = {
             cortas: ["CASA", "GATO", "PERRO", "MESA", "SOLAR", "LAGO", "NUBE", "FLOR", "PADRE", "MADRE", "LIBRO", "ARBOL"],
            medianas: ["CAMINO", "CIUDAD", "TIEMPO", "PINTURA", "CABEZA", "CAMISA", "BLANCO", "MUSICA", "MADERA", "VERANO"],
            largas: ["VENTANA", "SEMANA", "JUGADOR", "TRABAJO", "HERMANO", "TELEFONO", "ESCUELA", "PLANETA", "MONTAÑA"],
            muyLargas: ["COMPUTADORA", "ARQUITECTURA", "DICCIONARIO", "FOTOGRAFIA", "LITERATURA", "MATEMATICAS"]
        };

        let temporizador = null;
        let tiempoRestante = 0;
        const TIEMPO_TOTAL_MS = 45000;
        let nivel = 1;
        let intentos = 3;
        let comodinesRestantes = 3;
        let palabraCorrecta = "";
        
        // Control de sesión y palabras jugadas en Firebase
        let idSesionJuego = null;
        let palabrasJugadasPartida = [];

        // Arreglos de control para casillas fijas y comodines
        let casillasUsuario = []; 
        let casillasFijas = []; 
        let procesandoEstado = false;

        function construirTeclado() {
            const contenedor = document.getElementById('teclado');
            contenedor.innerHTML = "";

            const filasQWERTY = [
                ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
                ["A", "S", "D", "F", "G", "H", "J", "K", "L", "Ñ"],
                ["Z", "X", "C", "V", "B", "N", "M"]
            ];

            filasQWERTY.forEach((filaLetras, index) => {
                const divFila = document.createElement('div');
                divFila.className = "fila-qwerty";

                filaLetras.forEach(letra => {
                    const btn = document.createElement('button');
                    btn.className = "btn-key btn-letra";
                    btn.textContent = letra;
                    btn.setAttribute('data-val', letra);
                    btn.addEventListener('click', () => agregarLetra(letra));
                    divFila.appendChild(btn);
                });

                if (index === 2) {
                    const btnBorrar = document.createElement('button');
                    btnBorrar.className = "btn-key btn-borrar";
                    btnBorrar.id = "btn-borrar";
                    btnBorrar.textContent = "⌫";
                    btnBorrar.addEventListener('click', borrarCaracter);
                    divFila.appendChild(btnBorrar);
                }

                contenedor.appendChild(divFila);
            });

            const filaValidar = document.createElement('div');
            filaValidar.className = "fila-qwerty";

            const btnValidar = document.createElement('button');
            btnValidar.className = "btn-key btn-validar";
            btnValidar.id = "btn-validar";
            btnValidar.textContent = "Validar ✓";
            btnValidar.addEventListener('click', validarRespuesta);
            filaValidar.appendChild(btnValidar);

            contenedor.appendChild(filaValidar);
        }

        // CONTROL PANTALLA COMPLETA
        function estaEnPantallaCompleta() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
        }

        function solicitarPantallaCompleta() {
            const elem = document.documentElement;
            if (!estaEnPantallaCompleta()) {
                if (elem.requestFullscreen) elem.requestFullscreen().catch(err => console.log(err));
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
            }
        }

        function salirPantallaCompleta() {
            if (estaEnPantallaCompleta()) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        function actualizarEstadoBotonFullscreen() {
            document.getElementById('btn-salir-fullscreen').disabled = !estaEnPantallaCompleta();
        }

        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(e => {
            document.addEventListener(e, actualizarEstadoBotonFullscreen);
        });

        // FIREBASE: GESTIÓN DE RÉCORD Y SESIÓN DE PALABRAS JUGADAS
        async function cargarRecordHistorico() {
            try {
                const docRef = doc(db, "puntuaciones", "recordAnagramas");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    document.getElementById('label-record').textContent = docSnap.data().puntuacion || 0;
                }
            } catch (error) {
                console.error("Error al cargar récord:", error);
            }
        }

        async function guardarPuntuacion(nuevaPuntuacion) {
            try {
                const docRef = doc(db, "puntuaciones", "recordAnagramas");
                const docSnap = await getDoc(docRef);
                let actual = 0;
                if (docSnap.exists()) actual = docSnap.data().puntuacion || 0;

                if (nuevaPuntuacion > actual) {
                    await setDoc(docRef, { puntuacion: nuevaPuntuacion });
                    document.getElementById('label-record').textContent = nuevaPuntuacion;
                }
            } catch (error) {
                console.error("Error al guardar puntuación:", error);
            }
        }

        async function iniciarSesionFirebase() {
            idSesionJuego = "partida_" + Date.now();
            palabrasJugadasPartida = [];
            try {
                const docRef = doc(db, "sesiones_juego", idSesionJuego);
                await setDoc(docRef, {
                    creada: new Date().toISOString(),
                    palabrasUsadas: []
                });
            } catch (e) {
                console.warn("No se pudo iniciar la sesión en Firestore:", e);
            }
        }

        async function registrarPalabraEnFirebase(palabra) {
            palabrasJugadasPartida.push(palabra);
            if (!idSesionJuego) return;
            try {
                const docRef = doc(db, "sesiones_juego", idSesionJuego);
                await updateDoc(docRef, {
                    palabrasUsadas: arrayUnion(palabra)
                });
            } catch (e) {
                console.warn("No se pudo actualizar el registro de palabras en Firestore:", e);
            }
        }

        cargarRecordHistorico();

        function actualizarInterfazIntentos() {
            const c1 = document.getElementById('corazon-1');
            const c2 = document.getElementById('corazon-2');
            const c3 = document.getElementById('corazon-3');

            c1.className = intentos >= 1 ? "corazon activo" : "corazon inactivo";
            c2.className = intentos >= 2 ? "corazon activo" : "corazon inactivo";
            c3.className = intentos >= 3 ? "corazon activo" : "corazon inactivo";
        }

        function actualizarInterfazComodines() {
            for (let i = 1; i <= 3; i++) {
                const btnComodin = document.getElementById(`comodin-${i}`);
                if (i <= comodinesRestantes) {
                    btnComodin.disabled = false;
                } else {
                    btnComodin.disabled = true;
                }
            }
        }

        function desordenarPalabra(palabra) {
            let arreglo = palabra.split("");
            let mezclada = palabra;

            while (mezclada === palabra && palabra.length > 1) {
                for (let i = arreglo.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arreglo[i], arreglo[j]] = [arreglo[j], arreglo[i]];
                }
                mezclada = arreglo.join("");
            }
            return mezclada;
        }

        // Variable global para almacenar el diccionario en español una sola vez
        let diccionarioGlobalEspanol = null;

        async function obtenerPalabraAleatoria() {
            let minLongitud = 4, maxLongitud = 5;
            let categoriaLocal = "cortas";

            if (nivel >= 3 && nivel < 6) { minLongitud = 6; maxLongitud = 7; categoriaLocal = "medianas"; }
            if (nivel >= 6 && nivel < 9) { minLongitud = 7; maxLongitud = 8; categoriaLocal = "largas"; }
            if (nivel >= 9) { minLongitud = 9; maxLongitud = 12; categoriaLocal = "muyLargas"; }

            let palabraCandidata = "";

            try {
                // Descarga un diccionario real en español alojado en jsDelivr
                if (!diccionarioGlobalEspanol) {
                    const resp = await fetch("https://cdn.jsdelivr.net/gh/bitcoin/bips@master/bip-0039/spanish.txt");
                    
                    if (resp.ok) {
                        const texto = await resp.text();
                        // Convertimos el archivo de texto (una palabra por línea) en un Array
                        diccionarioGlobalEspanol = texto
                            .split("\n")
                            .map(w => w.trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""))
                            .filter(w => w.length > 0);
                    }
                }

                if (diccionarioGlobalEspanol && diccionarioGlobalEspanol.length > 0) {
                    const palabrasFiltradas = diccionarioGlobalEspanol.filter(limpia => 
                        /^[A-ZÑ]+$/.test(limpia) && 
                        limpia.length >= minLongitud && 
                        limpia.length <= maxLongitud && 
                        !palabrasJugadasPartida.includes(limpia)
                    );

                    if (palabrasFiltradas.length > 0) {
                        palabraCandidata = palabrasFiltradas[Math.floor(Math.random() * palabrasFiltradas.length)];
                    }
                }
            } catch (e) {
                console.error("Error al obtener las palabras remotas:", e);
            }

            // Respaldo local
            if (!palabraCandidata) {
                console.warn("Utilizando diccionario de respaldo local.");
                const listaLocal = DICCIONARIO_LOCAL[categoriaLocal];
                const sinRepetir = listaLocal.filter(p => !palabrasJugadasPartida.includes(p));
                
                if (sinRepetir.length > 0) {
                    palabraCandidata = sinRepetir[Math.floor(Math.random() * sinRepetir.length)];
                } else {
                    palabraCandidata = listaLocal[Math.floor(Math.random() * listaLocal.length)];
                }
            }

            await registrarPalabraEnFirebase(palabraCandidata);
            return palabraCandidata;
        }

        async function generarOperacion() {
            document.getElementById('label-operacion').textContent = "CARGANDO...";
            palabraCorrecta = await obtenerPalabraAleatoria();
            
            const palabraDesordenada = desordenarPalabra(palabraCorrecta);
            document.getElementById('label-operacion').textContent = palabraDesordenada;
            
            // Inicializar casillas vacías con "_"
            casillasUsuario = new Array(palabraCorrecta.length).fill("_");
            casillasFijas = new Array(palabraCorrecta.length).fill(false);
            
            intentos = 3;
            actualizarInterfazIntentos();
            actualizarPantallaRespuesta();
        }

        function actualizarPantallaRespuesta() {
            document.getElementById('pantalla-respuesta').textContent = casillasUsuario.join(" ");
        }

        function usarComodin() {
            if (comodinesRestantes <= 0 || !temporizador || procesandoEstado) return;

            let posAInsertar = -1;
            for (let i = 0; i < palabraCorrecta.length; i++) {
                if (!casillasFijas[i]) {
                    posAInsertar = i;
                    break;
                }
            }

            if (posAInsertar !== -1) {
                casillasUsuario[posAInsertar] = palabraCorrecta[posAInsertar];
                casillasFijas[posAInsertar] = true;
                comodinesRestantes--;
                
                actualizarInterfazComodines();
                actualizarPantallaRespuesta();

                const Toast = Swal.mixin({
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 1000
                });
                Toast.fire({
                    icon: 'info',
                    title: `¡Pista activada! Letra: ${palabraCorrecta[posAInsertar]}`
                });
            }
        }

        function agregarLetra(letra) {
            if (procesandoEstado) return;
            
            for (let i = 0; i < casillasUsuario.length; i++) {
                if (!casillasFijas[i] && casillasUsuario[i] === "_") {
                    casillasUsuario[i] = letra.toUpperCase();
                    actualizarPantallaRespuesta();
                    break;
                }
            }
        }

        function borrarCaracter() {
            if (procesandoEstado) return;

            for (let i = casillasUsuario.length - 1; i >= 0; i--) {
                if (!casillasFijas[i] && casillasUsuario[i] !== "_") {
                    casillasUsuario[i] = "_";
                    actualizarPantallaRespuesta();
                    break;
                }
            }
        }

        function reiniciarJuego() {
            if (temporizador) {
                clearInterval(temporizador);
                temporizador = null;
            }
            tiempoRestante = 0;
            nivel = 1;
            intentos = 3;
            comodinesRestantes = 3;
            procesandoEstado = false;
            idSesionJuego = null;
            palabrasJugadasPartida = [];

            const pantalla = document.getElementById('pantalla-respuesta');
            pantalla.classList.remove('pantalla-fallo', 'pantalla-acierto');
            
            actualizarInterfazIntentos();
            actualizarInterfazComodines();
            
            document.getElementById('label-level').textContent = nivel;
            document.getElementById('label-operacion').textContent = "PALABRA";
            casillasUsuario = [];
            casillasFijas = [];
            actualizarPantallaRespuesta();

            const boton = document.getElementById('btn-comenzar');
            boton.disabled = false;
            boton.style.backgroundColor = '#28a745';
            boton.style.cursor = 'pointer';
        }

        function avisoTiempoAgotado() {
            const puntuacionActual = parseInt(document.getElementById('label-score').textContent, 10);
            const palabraBuscada = palabraCorrecta;
            guardarPuntuacion(puntuacionActual);
            reiniciarJuego();

            Swal.fire({
                title: '¡Tiempo Agotado!',
                html: `<p>Se ha agotado el tiempo.</p><br><p>La palabra buscada era: <strong style="color: #4ADE80; font-size: 1.3rem;">${palabraBuscada}</strong></p><br><p>Puntuación final: <strong>${puntuacionActual}</strong></p>`,
                icon: 'warning',
                confirmButtonText: 'Aceptar'
            });
        }

        function avisoLose() {
            const puntuacionActual = parseInt(document.getElementById('label-score').textContent, 10);
            const palabraBuscada = palabraCorrecta;
            guardarPuntuacion(puntuacionActual);
            reiniciarJuego();

            Swal.fire({
                title: '¡Partida Finalizada!',
                html: `<p>Has agotado los 3 intentos para esta palabra.</p><br><p>La palabra buscada era: <strong style="color: #4ADE80; font-size: 1.3rem;">${palabraBuscada}</strong></p><br><p>Puntuación final: <strong>${puntuacionActual}</strong></p>`,
                icon: 'error',
                confirmButtonText: 'Aceptar'
            });
        }

        function iniciarBarraTiempo(tiempo) {
            const intervaloMs = 50;
            const barra = document.getElementById('barraRelleno');
            tiempoRestante = tiempo;

            barra.style.width = '100%';
            barra.style.backgroundColor = '#4CAF50';

            if (temporizador) clearInterval(temporizador);

            temporizador = setInterval(() => {
                tiempoRestante -= intervaloMs;
                let porcentaje = (tiempoRestante / TIEMPO_TOTAL_MS) * 100;

                if (porcentaje <= 0) {
                    porcentaje = 0;
                    clearInterval(temporizador);
                    temporizador = null;
                    avisoTiempoAgotado();
                }

                if (porcentaje > 100) porcentaje = 100;
                barra.style.width = porcentaje + '%';

                if (porcentaje < 25) {
                    barra.style.backgroundColor = '#f44336';
                } else {
                    barra.style.backgroundColor = '#4CAF50';
                }
            }, intervaloMs);
        }

        async function comenzarJuego() {
            solicitarPantallaCompleta();

            const boton = document.getElementById('btn-comenzar');
            boton.style.backgroundColor = '#808080';
            boton.style.cursor = 'not-allowed';
            boton.disabled = true;

            nivel = 1;
            intentos = 3;
            comodinesRestantes = 3;
            procesandoEstado = false;

            await iniciarSesionFirebase();

            const pantalla = document.getElementById('pantalla-respuesta');
            pantalla.classList.remove('pantalla-fallo', 'pantalla-acierto');
            
            document.getElementById('label-level').textContent = nivel;
            document.getElementById('label-score').textContent = '0';

            actualizarInterfazComodines();
            await generarOperacion();
            iniciarBarraTiempo(TIEMPO_TOTAL_MS);
        }

        async function validarRespuesta() {
            const palabraIngresada = casillasUsuario.join("");
            if (palabraIngresada.includes("_") || !temporizador || procesandoEstado) return;

            const pantalla = document.getElementById('pantalla-respuesta');

            if (palabraIngresada === palabraCorrecta) {
                procesandoEstado = true;
                pantalla.classList.add('pantalla-acierto');

                const puntosGanados = 15 + (nivel - 1) * 3;
                const scoreLabel = document.getElementById('label-score');
                scoreLabel.textContent = parseInt(scoreLabel.textContent, 10) + puntosGanados;

                nivel++;
                document.getElementById('label-level').textContent = nivel;

                tiempoRestante += 6000;
                if (tiempoRestante > TIEMPO_TOTAL_MS) tiempoRestante = TIEMPO_TOTAL_MS;

                const Toast = Swal.mixin({
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 1000,
                    timerProgressBar: true
                });
                Toast.fire({
                    icon: 'success',
                    title: `¡Correcto! (+${puntosGanados} pts)`
                });

                setTimeout(async () => {
                    pantalla.classList.remove('pantalla-acierto');
                    await generarOperacion();
                    procesandoEstado = false;
                }, 1000);

            } else {
                intentos--;
                actualizarInterfazIntentos();

                pantalla.classList.add('pantalla-fallo');
                procesandoEstado = true;

                if (intentos > 0) {
                    const Toast = Swal.mixin({
                        toast: true,
                        position: 'top-end',
                        showConfirmButton: false,
                        timer: 1500,
                        timerProgressBar: true
                    });
                    Toast.fire({
                        icon: 'error',
                        title: '¡Incorrecto! Vuelve a intentarlo'
                    });

                    setTimeout(() => {
                        pantalla.classList.remove('pantalla-fallo');
                        for (let i = 0; i < casillasUsuario.length; i++) {
                            if (!casillasFijas[i]) {
                                casillasUsuario[i] = "_";
                            }
                        }
                        actualizarPantallaRespuesta();
                        procesandoEstado = false;
                    }, 1000);
                } else {
                    if (temporizador) {
                        clearInterval(temporizador);
                        temporizador = null;
                    }
                    setTimeout(() => {
                        avisoLose();
                    }, 300);
                }
            }
        }

        // EVENTOS
        construirTeclado();

        document.getElementById('btn-comenzar').addEventListener('click', comenzarJuego);
        document.getElementById('btn-salir-fullscreen').addEventListener('click', salirPantallaCompleta);

        for (let i = 1; i <= 3; i++) {
            document.getElementById(`comodin-${i}`).addEventListener('click', usarComodin);
        }

        document.addEventListener('keydown', (event) => {
            if (!temporizador || procesandoEstado) return;

            const tecla = event.key.toUpperCase();
            if (/^[A-ZÑ]$/.test(tecla)) {
                agregarLetra(tecla);
            } else if (event.key === 'Backspace') {
                borrarCaracter();
            } else if (event.key === 'Enter') {
                validarRespuesta();
            }
        });
    </script>
</body>
</html>
